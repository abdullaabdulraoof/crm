<div
  class="fixed inset-0 z-50 flex items-end justify-center overflow-y-auto bg-slate-900/50 p-0 sm:items-center sm:p-4"
  (click)="onCancel()"
>
  <div
    role="dialog"
    aria-modal="true"
    aria-labelledby="leadFormTitle"
    class="flex max-h-[92dvh] w-full max-w-2xl flex-col rounded-t-2xl bg-white shadow-xl sm:rounded-2xl"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4 sm:px-6">
      <h2 id="leadFormTitle" class="text-lg font-semibold text-slate-900">
        {{ isEdit ? 'Edit Lead' : 'Add Lead' }}
      </h2>
      <button
        type="button"
        (click)="onCancel()"
        aria-label="Close dialog"
        class="rounded-lg p-1.5 text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 motion-reduce:transition-none"
      >
        <app-icon name="close" [size]="20" />
      </button>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      novalidate
      class="flex min-h-0 flex-1 flex-col"
    >
      <div class="flex-1 overflow-y-auto px-5 py-5 sm:px-6">
        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label for="name" class="block text-sm font-medium text-slate-700">
              Name <span class="text-red-500">*</span>
            </label>
            <input
              id="name"
              type="text"
              formControlName="name"
              [attr.aria-invalid]="showError('name')"
              [attr.aria-describedby]="showError('name') ? 'nameError' : null"
              [class]="fieldClass('name')"
            />
            @if (showError('name')) {
              <p id="nameError" class="mt-1 text-sm text-red-600">
                Name is required (min 2 characters).
              </p>
            }
          </div>

          <div>
            <label for="phoneNumber" class="block text-sm font-medium text-slate-700">
              Phone Number <span class="text-red-500">*</span>
            </label>
            <input
              id="phoneNumber"
              type="text"
              formControlName="phoneNumber"
              [attr.aria-invalid]="showError('phoneNumber')"
              [attr.aria-describedby]="showError('phoneNumber') ? 'phoneNumberError' : null"
              [class]="fieldClass('phoneNumber')"
            />
            @if (showError('phoneNumber')) {
              <p id="phoneNumberError" class="mt-1 text-sm text-red-600">
                Phone number is required.
              </p>
            }
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
            <input
              id="email"
              type="email"
              formControlName="email"
              [attr.aria-invalid]="showError('email')"
              [attr.aria-describedby]="showError('email') ? 'emailError' : null"
              [class]="fieldClass('email')"
            />
            @if (showError('email')) {
              <p id="emailError" class="mt-1 text-sm text-red-600">
                Enter a valid email address.
              </p>
            }
          </div>

          <div>
            <label for="source" class="block text-sm font-medium text-slate-700">Source</label>
            <select
              id="source"
              formControlName="source"
              class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
            >
              <option value="WEBSITE">Website</option>
              <option value="PHONE">Phone</option>
              <option value="WHATSAPP">WhatsApp</option>
              <option value="REFERRAL">Referral</option>
              <option value="SOCIAL_MEDIA">Social Media</option>
              <option value="OTHER">Other</option>
            </select>
          </div>

          <div>
            <label for="status" class="block text-sm font-medium text-slate-700">Status</label>
            <select
              id="status"
              formControlName="status"
              class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
            >
              <option value="NEW">New</option>
              <option value="CONTACTED">Contacted</option>
              <option value="QUALIFIED">Qualified</option>
              <option value="PROPOSAL_SENT">Proposal Sent</option>
              <option value="WON">Won</option>
              <option value="LOST">Lost</option>
            </select>
          </div>

          <div>
            <label for="assignedTo" class="block text-sm font-medium text-slate-700">
              Assigned To
            </label>
            <select
              id="assignedTo"
              formControlName="assignedTo"
              class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
            >
              <option value="">—</option>
              @for (u of users(); track u.id) {
                <option [value]="u.id">{{ u.name }}</option>
              }
            </select>
          </div>

          <div class="md:col-span-2">
            <label for="nextFollowUpAt" class="block text-sm font-medium text-slate-700">
              Next Follow-up
            </label>
            <input
              id="nextFollowUpAt"
              type="datetime-local"
              formControlName="nextFollowUpAt"
              class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
            />
          </div>

          <div class="md:col-span-2">
            <label for="notes" class="block text-sm font-medium text-slate-700">Notes</label>
            <textarea
              id="notes"
              formControlName="notes"
              rows="3"
              class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
            ></textarea>
          </div>
        </div>

        @if (formError()) {
          <div
            class="mt-4 flex items-start gap-2 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800"
            role="alert"
          >
            <app-icon name="error" [size]="18" class="mt-0.5 shrink-0 text-red-600" />
            <span>{{ formError() }}</span>
          </div>
        }
      </div>

      <div
        class="flex items-center justify-end gap-2 border-t border-slate-100 px-5 py-4 sm:px-6"
      >
        <button
          type="button"
          (click)="onCancel()"
          class="rounded-lg border border-slate-300 px-3.5 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 motion-reduce:transition-none"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="form.invalid || submitting()"
          class="rounded-lg bg-indigo-600 px-3.5 py-2 text-sm font-semibold text-white transition-colors hover:bg-indigo-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:bg-indigo-300 motion-reduce:transition-none"
        >
          {{ submitting() ? 'Saving...' : (isEdit ? 'Update Lead' : 'Save Lead') }}
        </button>
      </div>
    </form>
  </div>
</div>
