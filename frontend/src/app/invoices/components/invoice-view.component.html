<div class="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-gray-900/50 px-4 py-8">
  <div class="w-full max-w-3xl rounded-lg bg-white shadow-xl">
    <div class="flex flex-wrap items-center justify-between gap-3 border-b px-6 py-4">
      <h2 class="text-lg font-semibold text-gray-900">
        Invoice {{ invoice?.invoiceNumber }}
      </h2>
      <div class="flex flex-wrap items-center gap-2">
        <button
          type="button"
          (click)="onDownloadPdf()"
          [disabled]="downloading() || !invoice"
          class="inline-flex items-center gap-1.5 rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 disabled:cursor-not-allowed disabled:opacity-60 motion-reduce:transition-none"
        >
          <app-icon name="download" [size]="16" />
          {{ downloading() ? 'Generating…' : 'Download PDF' }}
        </button>
        <button
          type="button"
          (click)="onPrint()"
          [disabled]="!invoice"
          class="inline-flex items-center gap-1.5 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 disabled:cursor-not-allowed disabled:opacity-60 motion-reduce:transition-none"
        >
          <app-icon name="printer" [size]="16" />
          Print Invoice
        </button>
        <button
          type="button"
          (click)="onClose()"
          class="rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-700 hover:bg-gray-100"
        >
          Close
        </button>
      </div>
    </div>

    <div class="px-6 py-5">
      @if (actionError()) {
        <div class="mb-4 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
          {{ actionError() }}
        </div>
      }

      @if (invoice) {
        <div #invoiceDocRoot class="mx-auto max-w-3xl">
          <app-invoice-document [invoice]="invoice" />
        </div>
      }
    </div>
  </div>
</div>
